services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env.secrets
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beehex_db}
      POSTGRES_USER: ${POSTGRES_USER:-beehex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beehex} -d ${POSTGRES_DB:-beehex_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/ashokaas/beehex-api:latest
    container_name: beehex-api
    restart: unless-stopped
    env_file:
      - .env.secrets
    environment:
      NODE_ENV: production
      PORT: 3001
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-beehex.fr}
      COOKIE_SECURE: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://v2.beehex.fr}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-beehex_db}
      POSTGRES_USER: ${POSTGRES_USER:-beehex}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  websocket:
    image: ghcr.io/ashokaas/beehex-websocket:latest
    container_name: beehex-websocket
    restart: unless-stopped
    env_file:
      - .env.secrets
    environment:
      NODE_ENV: production
      WEBSOCKET_PORT: 3002
      DATABASE_ADDRESS: ${API_PUBLIC_URL:-https://v2.api.beehex.fr}
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - api

  frontend:
    image: ghcr.io/ashokaas/beehex-frontend:latest
    container_name: beehex-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data: