name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # 1. Construit les 3 images dans GH Actions et les pousse sur GHCR.
  #    Aucun secret n'entre dans les images (les URLs du frontend sont lues au
  #    RUNTIME via /api/config depuis le .env du serveur).
  build-images:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./beehex-api
          push: true
          tags: |
            ghcr.io/ashokaas/beehex-api:latest
            ghcr.io/ashokaas/beehex-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push WebSocket
        uses: docker/build-push-action@v6
        with:
          context: ./beehex-websocket
          push: true
          tags: |
            ghcr.io/ashokaas/beehex-websocket:latest
            ghcr.io/ashokaas/beehex-websocket:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/ashokaas/beehex-frontend:latest
            ghcr.io/ashokaas/beehex-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Branche les images déjà construites sur le serveur.
  #    - pulls le repo (compose + code source à jour)
  #    - écrit le .env RUNTIME depuis secrets + vars (jamais commité)
  #    - pull les images GHCR et relance les conteneurs
  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    environment: production

    steps:
      - name: Déployer sur le serveur
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSHKEY }}
          script: |
            git -C /opt/beehex pull --ff-only

            cat > /opt/beehex/.env <<'EOF'
            # > Variables GitHub (non-secrètes)
            COOKIE_DOMAIN=${{ vars.APP_DOMAIN }}
            CORS_ORIGIN=${{ vars.FRONTEND_PUBLIC_URL }}
            API_PUBLIC_URL=${{ vars.API_PUBLIC_URL }}
            # URLs du frontend, lues au runtime par /api/config :
            NEXT_PUBLIC_API_URL=${{ vars.API_PUBLIC_URL }}
            NEXT_PUBLIC_WEBSOCKET_URL=${{ vars.WS_PUBLIC_URL }}
            POSTGRES_DB=${{ vars.POSTGRES_DB }}
            POSTGRES_USER=${{ vars.POSTGRES_USER }}
            EOF

            cat > /opt/beehex/.env.secrets <<'EOF'
            # > Secrets GitHub (jamais affichés, jamais dans les images)
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            GAMESERVER_KEY=${{ secrets.GAMESERVER_KEY }}
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            EOF

            chmod 600 /opt/beehex/.env.secrets
            cd /opt/beehex
            docker compose pull
            docker compose up -d
            docker image prune -f